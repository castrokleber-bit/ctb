[project]
name = "ctb"
version = "0.1.0"
description = "Carga tributária brasileira — cálculo próprio automatizado (série 2016–2025)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
]

[project.scripts]
ctb = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
